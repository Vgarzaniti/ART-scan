<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ART-scan | Visor AR & Cámara</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- TensorFlow.js y MobileNet para reconocimiento directo de objetos -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .ar-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #reader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .ar-hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      box-sizing: border-box;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
      gap: 0.5rem;
    }

    .mode-indicator {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hud-reticle-box {
      align-self: center;
      width: 250px;
      height: 250px;
      border: 2px dashed rgba(6, 182, 212, 0.6);
      border-radius: 20px;
      position: relative;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
    }

    .hud-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: var(--accent-cyan);
      border-style: solid;
    }
    .c-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
    .c-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
    .c-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
    .c-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }

    .scanning-line {
      position: absolute;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      box-shadow: 0 0 15px var(--accent-cyan);
      top: 0;
      animation: scanAnim 2.2s infinite linear;
    }

    @keyframes scanAnim {
      0% { top: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .permission-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      text-align: center;
      z-index: 50;
      width: 85%;
      max-width: 360px;
      pointer-events: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .ar-info-card {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: 90%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(6, 182, 212, 0.4);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      z-index: 25;
      pointer-events: auto;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ar-info-card.active {
      transform: translateX(-50%) translateY(0%);
    }

    .ar-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
    }

    .btn-close-card {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sim-selector {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.4rem 0.6rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      max-width: 150px;
    }
  </style>
</head>
<body>

  <div class="ar-viewport">
    <div id="reader"></div>

    <div id="cameraPrompt" class="permission-modal" style="display:none;">
      <i class="fa-solid fa-camera" style="font-size: 2.5rem; color: var(--accent-cyan); margin-bottom: 1rem;"></i>
      <h3 style="margin-bottom: 0.5rem; font-size: 1.2rem;">Activar Cámara</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">
        Presiona para iniciar la cámara trasera y el reconocimiento AR.
      </p>
      <button id="btnStartCamera" class="btn btn-primary" style="width: 100%;">
        <i class="fa-solid fa-play"></i> Iniciar Escáner
      </button>
    </div>

    <div class="ar-hud-overlay">
      <div class="hud-header">
        <a href="index.html" class="btn btn-secondary" style="padding: 0.4rem 0.7rem; font-size: 0.8rem;">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div class="mode-indicator" id="aiModeIndicator">
          <i class="fa-solid fa-brain" style="color:var(--accent-cyan);"></i> IA Visión + QR
        </div>

        <select id="quickSimSelect" class="sim-selector">
          <option value="">Fijar objeto...</option>
          <option value="ART-001">ART-001 Calculadora Casio</option>
          <option value="ART-002">ART-002 Cargador Samsung USB-C</option>
          <option value="ART-003">ART-003 Joystick PS4</option>
          <option value="ART-004">ART-004 Auriculares Gamer</option>
        </select>
      </div>

      <div class="hud-reticle-box">
        <div class="hud-corner c-tl"></div>
        <div class="hud-corner c-tr"></div>
        <div class="hud-corner c-bl"></div>
        <div class="hud-corner c-br"></div>
        <div class="scanning-line"></div>
      </div>

      <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; text-shadow: 0 2px 4px #000; padding: 0.5rem; background: rgba(0,0,0,0.6); border-radius: 8px;">
        <span id="scanStatus"><i class="fa-solid fa-crosshairs"></i> Apunte al objeto o código QR...</span>
      </div>
    </div>

    <div id="arCard" class="ar-info-card">
      <button id="closeCardBtn" class="btn-close-card"><i class="fa-solid fa-xmark"></i></button>
      <span class="ar-tag" id="arTag"><i class="fa-solid fa-layer-group"></i> OBJETO IDENTIFICADO</span>
      
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:0.25rem;">
        <h3 id="arNombre" style="font-size:1.15rem; font-weight:800; color:#fff;">-</h3>
        <span id="arCodigo" class="card-code">-</span>
      </div>

      <p id="arDesc" style="color:var(--text-muted); font-size:0.8rem; margin: 0.4rem 0 0.8rem 0; line-height: 1.3;">-</p>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.8rem;">
        <div style="background: rgba(0,0,0,0.4); padding: 0.5rem; border-radius: 8px; border-left: 3px solid var(--accent-emerald);">
          <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">Stock Actual</div>
          <div id="arStock" style="font-size: 1rem; font-weight: 800; color: #fff;">-</div>
        </div>

        <div style="background: rgba(0,0,0,0.4); padding: 0.5rem; border-radius: 8px; border-left: 3px solid var(--accent-blue);">
          <div style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">Precio</div>
          <div id="arPrecio" style="font-size: 1rem; font-weight: 800; color: #fff;">-</div>
        </div>
      </div>

      <div class="location-box" style="margin-bottom: 0; padding: 0.5rem 0.8rem;">
        <div class="location-title" style="font-size: 0.65rem;"><i class="fa-solid fa-location-dot"></i> Ubicación Asignada</div>
        <div class="location-val" style="font-size: 0.9rem;">
          <span>Pasillo: <strong id="arPasillo">-</strong></span>
          <span>Estante: <strong id="arEstante">-</strong></span>
          <span>Nivel: <strong id="arNivel">-</strong></span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/scanner.js"></script>
</body>
</html>
